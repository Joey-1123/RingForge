name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "uv"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: |
          uv run mypy --ignore-missing-imports app/ downloader/ core/ analyzer/ audio/ || true

      - name: Unit tests
        run: |
          uv run pytest tests/ -v --tb=short --timeout=120

      - name: Coverage
        run: |
          uv run pytest tests/ --cov=analyzer --cov=core --cov=downloader --cov-report=term-missing || true

      - name: Build
        run: |
          uv build

      - name: Security audit
        run: |
          uv pip list --outdated || true
          uv pip audit || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "uv"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Verify CLI works
        run: |
          uv run ringforge --help
          uv run ringforge generate --help
          uv run ringforge batch --help
      - name: Run full pipeline test
        run: |
          uv run pytest tests/ --timeout=300 -k "test_" || true

  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "uv"
      - name: Auto-merge dependabot
        run: |
          gh pr merge --auto --merge "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Dependency caching
cache:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "uv"
    - name: Cache uv lockfile
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            uv.lock
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

# Pre-commit hooks
precommit:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "uv"
    - name: Install pre-commit
      run: uv add pre-commit --dev
    - name: Install hooks
      run: uv run pre-commit install
    - name: Run pre-commit
      run: uv run pre-commit run --all-files
