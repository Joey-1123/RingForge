[project]
name = "ringforge"
version = "0.2.0"
description = "Find the best moment in any audio and export it as a ringtone, notification, or clip"
requires-python = ">=3.12"
dependencies = [
    "pydub>=0.25.1",
    "librosa>=0.10.0",
    "click>=8.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "tomli>=2.0.0",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
youtube = [
    "yt-dlp>=2024.12.0",
    "requests>=2.31.0",
]
gui = [
    "pyside6>=6.6.0",
]
all = [
    "ringforge[youtube]",
    "ringforge[gui]",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "coverage>=7.6.0",
    "uv>=0.4.0",
]

[project.scripts]
ringforge = "app.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "core", "downloader", "audio", "analyzer", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B905", "UP031"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "coverage>=7.6.0",
]
